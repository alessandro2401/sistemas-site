<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portais e Sistemas</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
    <script>
    /* Bloqueia o badge "Made with Manus" — versão segura */
    (function() {
        var MANUS_SELECTORS = [
            '[data-manus]',
            '[id*="manus-badge"]',
            '[id*="manus-widget"]',
            '[class*="manus-badge"]',
            '[class*="manus-widget"]',
            '[class*="manus-branding"]',
            'a[href*="manus.im"]',
            'a[href*="manus.space"]'
        ];
        function removeManusBadge() {
            MANUS_SELECTORS.forEach(function(selector) {
                try {
                    document.querySelectorAll(selector).forEach(function(el) {
                        var tag = el.tagName ? el.tagName.toLowerCase() : '';
                        if (['style','script','link','head','body','html','meta'].indexOf(tag) === -1) {
                            el.remove();
                        }
                    });
                } catch(e) {}
            });
        }
        if (window.MutationObserver) {
            new MutationObserver(function(m) {
                m.forEach(function(x) { if (x.addedNodes.length) removeManusBadge(); });
            }).observe(document.documentElement, { childList: true, subtree: true });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', removeManusBadge);
        } else { removeManusBadge(); }
        window.addEventListener('load', function() {
            setTimeout(removeManusBadge, 500);
            setTimeout(removeManusBadge, 2000);
        });
    })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 35px; }
        .login-header .icon { font-size: 4rem; margin-bottom: 15px; display: block; }
        .login-header h1 { color: #667eea; font-size: 1.8rem; margin-bottom: 8px; }
        .login-header p  { color: #666; font-size: 0.95rem; }

        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 1rem; transition: all 0.3s ease; font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .form-group input::placeholder { color: #999; }

        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 1.05rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;
            font-size: 0.9rem; display: none; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .alert.show { display: block; }
        .alert-error   { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }

        .footer-text { text-align: center; margin-top: 25px; color: #999; font-size: 0.85rem; }

        @media (max-width: 480px) {
            .login-container { padding: 30px 25px; }
            .login-header h1 { font-size: 1.5rem; }
            .login-header .icon { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="icon">🔐</span>
            <h1>Portais e Sistemas</h1>
            <p>Acesso restrito a colaboradores autorizados</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email corporativo</label>
                <input type="email" id="email" name="email"
                    placeholder="seu.email@administradoramutual.com.br"
                    required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password"
                    placeholder="Digite sua senha"
                    required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
        </form>

        <div class="footer-text">
            &copy; 2025 Administradora Mutual
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        var loginForm   = document.getElementById('loginForm');
        var emailInput  = document.getElementById('email');
        var passwordInput = document.getElementById('password');
        var btnLogin    = document.getElementById('btnLogin');
        var alertBox    = document.getElementById('alertBox');

        // Se já autenticado, redireciona
        if (authManager.isAuthenticated()) {
            authManager.redirectAfterLogin();
        }

        function showAlert(message, type) {
            type = type || 'error';
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + type + ' show';
            setTimeout(function() { alertBox.classList.remove('show'); }, 5000);
        }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            var email    = emailInput.value.trim();
            var password = passwordInput.value;

            if (!email || !password) {
                showAlert('Por favor, preencha todos os campos.', 'error');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = 'Entrando...';

            setTimeout(function() {
                var result = authManager.login(email, password);
                if (result.success) {
                    showAlert(result.message, 'success');
                    setTimeout(function() { authManager.redirectAfterLogin(); }, 1000);
                } else {
                    showAlert(result.message, 'error');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }, 500);
        });

        emailInput.focus();
    </script>
</body>
</html>
